title: github copilot
description: ''
version: 3
scenes:
  - id: scene-mpcoi72d-fnty
    title: Testing out github copilot
    moves:
      - action: executeScript
        id: generate-mock
        command: node
        path: generate-mock.mjs
        args:
          - Hello from the mock file
          - demo1
        waitForMessage: Done.
        showProgress: true
        disabled: true
      - action: waitForTimeout
        timeout: 1000
        disabled: true
      - action: newCopilotChat
      - action: typeText
        content: Let me check if this is working with Demo Time
        insertTypingSpeed: 5
      - action: pressEnter
  - id: demo-mpcp232l-xh9x
    title: Another message
    moves:
      - action: executeScript
        id: generate-mock
        command: node
        path: generate-mock.mjs
        args:
          - This is a message from the second demo mock file
          - demo2
        showProgress: true
        waitForMessage: Done.
        disabled: true
      - action: waitForTimeout
        timeout: 1000
        disabled: true
      - action: newCopilotChat
      - action: typeText
        insertTypingSpeed: 5
        content: Can you tell a joke?
      - action: pressEnter
  - id: scene-file-mock
    title: Fake file creation message
    moves:
      - action: executeScript
        id: set-mock
        command: node
        path: set-mock.mjs
        args:
          - file-creation
        waitForMessage: Done.
        showProgress: true
        disabled: true
      - action: waitForTimeout
        timeout: 1000
        disabled: true
      - action: newCopilotChat
      - action: typeText
        insertTypingSpeed: 5
        content: Can you create me a `test.json` file with some dummy content?
      - action: pressEnter
